services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger
      POSTGRES_DB: finledger
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db

  nats:
    image: nats:2-alpine
    ports:
      - '4222:4222'
      - '8222:8222'

volumes:
  pgdata:
  mongodata:
